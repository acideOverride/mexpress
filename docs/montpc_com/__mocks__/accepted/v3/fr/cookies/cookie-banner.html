<!-- Cookie Consent Banner -->
<div id="cookie-consent" class="cookie-banner">
  <div class="cookie-content">
    <p class="cookie-message">
      Ce site utilise des cookies pour améliorer votre expérience. Nous utilisons des cookies essentiels pour le fonctionnement du site et, avec votre consentement, des cookies d'analyse pour comprendre comment vous interagissez avec notre site.
    </p>
    <div class="cookie-actions">
      <a href="/legals/politique-confidentialite.html" class="cookie-policy-link">En savoir plus</a>
      <button id="cookie-reject" class="cookie-reject-btn">Refuser</button>
      <button id="cookie-accept" class="cookie-accept-btn">Accepter</button>
    </div>
  </div>
</div>
